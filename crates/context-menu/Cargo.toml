[package]
name = "context-menu"
version = "0.1.0"
description = "Put your app in the right-click menu of Windows Explorer, macOS Finder and Linux file managers"
readme = "../../README.md"
keywords = ["context-menu", "file-manager", "explorer", "finder", "nautilus"]
categories = ["os", "gui"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# The classic menu's verbs, in the registry.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# The tests read the registry back.
[target.'cfg(windows)'.dev-dependencies]
winreg = "0.56"

[lints]
workspace = true
