name: Release

# Builds the native Nautilus extension for each architecture. On a tag
# (vX.Y.Z), the libraries and their sums go to a draft release, published by
# hand; run by hand, they are the run's artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nautilus:
    name: Nautilus extension (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04's glibc (2.35) is older than any distribution's with
        # Nautilus 43 or later, so the library loads on all of them.
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p context-menu-nautilus
      - name: Name, strip and sum it
        run: |
          out=libcontext-menu-nautilus-${{ matrix.arch }}.so
          strip -o "$out" target/release/libcontext_menu_nautilus.so
          sha256sum "$out" > "$out.sha256"
          objdump -T "$out" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-${{ matrix.arch }}
          path: libcontext-menu-nautilus-${{ matrix.arch }}.so*
          if-no-files-found: error

  publish:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: nautilus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --verify-tag --title "context-menu-rs $TAG" --generate-notes
